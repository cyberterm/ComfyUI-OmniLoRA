[project]
name = "comfyui-omni-lora"
description = "General-Purpose Multi-Backend PyTorch LoRA Trainer for ComfyUI (Intel Arc XPU, ROCm, CUDA, Cloud TPU, Ascend NPU, Gaudi HPU, MPS, CPU)."
version = "1.2.0"
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
# Zero external pip dependencies: relies solely on packages already bundled in ComfyUI (torch, safetensors, Pillow)
dependencies = []

[project.urls]
Repository = "https://github.com/cyberterm/ComfyUI-OmniLoRA"

[tool.comfy]
PublisherId = "cyberterm"
DisplayName = "OmniLoRA"
Icon = ""
