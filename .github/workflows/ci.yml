name: CPU Unit & Model Contract Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ComfyUI-OmniLoRA
        uses: actions/checkout@v4
        with:
          path: omni_lora

      - name: Checkout ComfyUI (for real-model contract tests)
        uses: actions/checkout@v4
        with:
          repository: comfyanonymous/ComfyUI
          path: ComfyUI
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU PyTorch and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r ComfyUI/requirements.txt
          pip install -r omni_lora/requirements.txt
          pip install aiohttp

      - name: Syntax check
        run: python -m compileall -q omni_lora

      - name: Run unit and real-model contract tests on CPU
        env:
          PYTHONPATH: .
        run: python -m unittest omni_lora.tests.test_framework omni_lora.tests.test_real_model_contracts -v
